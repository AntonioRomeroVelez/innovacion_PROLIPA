<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e9c">
  <meta name="description" content="Juego educativo de PROLIPA para aprender los sonidos de las letras en español, de Inicial a 3º EGB, con Libi el libro viajero.">
  <title>Aprendo a leer con Libi · PROLIPA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pantalla="bienvenida">

  <!-- Fondo: cielo andino, nubes y volcán -->
  <div class="fondo" aria-hidden="true">
    <div class="sol"></div>
    <div class="nube n1"></div><div class="nube n2"></div><div class="nube n3"></div>
    <svg class="montes" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 230 L170 120 L260 175 L420 70 L560 190 L700 130 L860 215 L1010 90 L1150 180 L1290 110 L1440 200 L1440 320 L0 320Z" fill="#a9c4ff"/>
      <path d="M420 70 L455 112 L430 108 L420 122 L400 106 L385 112Z" fill="#fff" opacity=".9"/>
      <path d="M1010 90 L1046 130 L1022 126 L1010 140 L992 124 L976 130Z" fill="#fff" opacity=".9"/>
      <path d="M0 270 Q180 210 360 262 T720 250 T1080 258 T1440 236 L1440 320 L0 320Z" fill="#7bd49a"/>
      <path d="M0 296 Q240 262 480 292 T960 286 T1440 280 L1440 320 L0 320Z" fill="#4fbf7c"/>
    </svg>
  </div>

  <header id="barra" hidden>
    <button id="btn-inicio" class="barra-btn" type="button" aria-label="Inicio">🏠</button>
    <img class="logo-barra" src="img/prolipa-logo.png" alt="PROLIPA, vanguardia en educación">
    <div id="titulo-barra">Aprendo a leer con Libi</div>
    <button id="contador-estrellas" class="chip-estrellas" type="button" aria-label="Mis estrellas">⭐ <b id="n-estrellas">0</b></button>
    <button id="btn-medallas" class="barra-btn" type="button" aria-label="Mis medallas">🏅</button>
    <button id="btn-ajustes" class="barra-btn" type="button" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="pantalla" tabindex="-1"></main>

  <div id="libi-fijo"></div>
  <div id="modales"></div>

  <noscript><p style="padding:24px;font:600 20px sans-serif">Esta aplicación necesita JavaScript para funcionar.</p></noscript>

  <!-- Librerías (incluidas en /lib para que funcione sin internet) -->
  <script src="lib/gsap.min.js"></script>
  <script src="lib/confetti.min.js"></script>
  <script src="lib/Sortable.min.js"></script>

  <!-- Aplicación -->
  <script src="js/datos.js"></script>
  <script src="js/frases.js"></script>
  <script src="js/audio-voces.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/libi.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/juegos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
